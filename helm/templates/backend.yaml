# ============================================================
# Backend: Service and Deployment
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      name: http
  selector:
    app: backend
  type: {{ .Values.backend.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql:3306/{{ .Values.mysql.database }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: MYSQL_USERNAME
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.mysql.rootPassword | quote }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.backend.env.GOOGLE_OAUTH_CLIENT_ID | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              value: {{ .Values.backend.env.GOOGLE_OAUTH_CLIENT_SECRET | quote }}
            - name: CLOUDINARY_CLOUD_NAME
              value: {{ .Values.backend.env.CLOUDINARY_CLOUD_NAME | quote }}
            - name: CLOUDINARY_API_KEY
              value: {{ .Values.backend.env.CLOUDINARY_API_KEY | quote }}
            - name: CLOUDINARY_API_SECRET
              value: {{ .Values.backend.env.CLOUDINARY_API_SECRET | quote }}
            - name: STRIPE_SECRET_KEY
              value: {{ .Values.backend.env.STRIPE_SECRET_KEY | quote }}
            - name: STRIPE_WEBHOOK_SECRET
              value: {{ .Values.backend.env.STRIPE_WEBHOOK_SECRET | quote }}
            - name: STRIPE_SUCCESS_URL
              value: {{ .Values.backend.env.STRIPE_SUCCESS_URL | quote }}
            - name: STRIPE_CANCEL_URL
              value: {{ .Values.backend.env.STRIPE_CANCEL_URL | quote }}
          readinessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
